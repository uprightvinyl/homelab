# Proxmox configuration playbook - runs using SSH from Macbook. 
# Semaphore is configured to use the API user with Proxmox, it doesn't have SSH access.
# These tasks therefore need to be run separately.
# Note: Run this as root user, e.g.
# ansible-playbook playbooks/proxmox-os.yaml -u root --private-key ~/.ssh/id_ed25519 --ask-vault-pass

---
- name: Configure Proxmox host OS
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Create chris user
      user:
        name: chris
        shell: /bin/bash
        groups: sudo        # no effect until sudo is installed; forward-compatible
        append: true

    - name: Add chris SSH key
      authorized_key:
        user: chris
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINiVgzG4B9lXj7STL4S+g/l95BXNWpYqkRIP3x1Qa89H chris"
        state: present

    - name: Point chrony at the waddle NTP server
      copy:
        dest: /etc/chrony/conf.d/waddle.conf
        content: |
          server 10.0.10.10 iburst prefer
        mode: '0644'
      notify: Restart chrony

- name: Enable IOMMU and VFIO for PCIe passthrough on kirby
  hosts: kirby
  gather_facts: false
  tasks:
    - name: Enable Intel IOMMU in GRUB
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet intel_iommu=on iommu=pt"'
        backup: true
      notify: Update GRUB

    - name: Load VFIO modules at boot
      copy:
        dest: /etc/modules-load.d/vfio.conf
        content: |
          vfio
          vfio_iommu_type1
          vfio_pci
        mode: '0644'
      notify: Reboot required

  handlers:
    - name: Update GRUB
      command: update-grub
      listen: Update GRUB

    - name: Reboot required
      debug:
        msg: "VFIO modules added — reboot kirby to apply all changes."
      listen: Reboot required

    - name: Restart chrony
      service:
        name: chrony
        state: restarted