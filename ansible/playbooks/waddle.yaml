---
- name: Configure waddle
  hosts: waddle
  become: true
  tasks:
    - name: Create semaphore user
      user:
        name: semaphore
        groups: sudo
        shell: /bin/bash
        append: true

    - name: Configure passwordless sudo for semaphore user
      lineinfile:
        path: /etc/sudoers.d/semaphore
        line: 'semaphore ALL=(ALL) NOPASSWD:ALL'
        create: true
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Add semaphore public key to local semaphore user #allows semaphore to connect to host with it's private key
      authorized_key:
        user: semaphore
        key: "{{ lookup('file', playbook_dir + '/../files/semaphore_service_key.pub') }}"
        state: present

    - name: Install Docker prerequisites
      apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create Docker keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian trixie stable"
        state: present
        filename: docker
    
    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add chris to docker group
      user:
        name: chris
        groups: docker
        append: true

    - name: Create Docker compose directory for waddle
      file:
        path: /home/chris/docker/waddle
        state: directory
        mode: '0755'
        owner: chris
        group: chris

    - name: Copy Semaphore Dockerfile to waddle
      copy:
        src: "{{ playbook_dir }}/../../docker/waddle/semaphore.Dockerfile"
        dest: /home/chris/docker/waddle/semaphore.Dockerfile
        owner: chris
        group: chris
        mode: '0644'

    - name: Copy docker-compose file to waddle
      copy:
        src: "{{ playbook_dir }}/../../docker/waddle/docker-compose.yaml"
        dest: /home/chris/docker/waddle/docker-compose.yaml
        owner: chris
        group: chris
        mode: '0644'

    - name: Generate .env file from vault secrets
      template:
        src: "{{ playbook_dir }}/../templates/waddle.env.j2"
        dest: /home/chris/docker/waddle/.env
        owner: chris
        group: chris
        mode: '0600'

    - name: Start Docker compose stack
      community.docker.docker_compose_v2:
        project_src: /home/chris/docker/waddle
        state: present
        build: policy #change to always to force a rebuild if the compose file has changed.