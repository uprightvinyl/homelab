---
- name: Configure Proxmox networking
  hosts: proxmox
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ ansible_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: false
  tasks:
    - name: Make vmbr0 VLAN-aware (staged)
      community.proxmox.proxmox_node_network:
        node: "{{ inventory_hostname }}"
        state: present
        iface: vmbr0
        iface_type: bridge
        bridge_ports: lan0
        bridge_vlan_aware: true
        cidr: "{{ ansible_host }}/24"
        gateway: 10.0.10.1
        autostart: true
      register: vmbr0_staged

    - name: Apply staged network changes
      community.proxmox.proxmox_node_network:
        node: "{{ inventory_hostname }}"
        state: apply
      when: vmbr0_staged.changed