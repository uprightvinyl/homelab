---
- name: Configure bandee switch
  hosts: bandee
  gather_facts: false
  tasks:
    - name: Read current VLANs
      community.ciscosmb.command:
        commands: show vlan
      register: vlan_state
      changed_when: false                # a read never changes anything

    - name: Ensure required VLANs exist
      community.ciscosmb.command:
        commands:
          - configure terminal
          - vlan database
          - "vlan {{ item }}"
          - exit
          - end
      loop: "{{ vlans }}"
      when: vlan_state.stdout[0] is not search('(?m)^\s*' ~ item ~ '\s')
      changed_when: true                 # only reached when the VLAN was missing
      notify: Save running config

    - name: Read current L3 interfaces
      community.ciscosmb.command:
        commands: show ip interface
      register: ip_int_state
      changed_when: false

    - name: Ensure VLAN SVIs have their gateway IPs
      community.ciscosmb.command:
        commands:
          - configure terminal
          - "interface vlan {{ item.vlan }}"
          - "ip address {{ item.ip }} {{ item.mask }}"
          - exit
          - end
      loop: "{{ svis }}"
      when: item.ip not in ip_int_state.stdout[0]
      changed_when: true
      notify: Save running config

    - name: Read access port configs
      community.ciscosmb.command:
        commands: "show running-config interface {{ item.port }}"
      loop: "{{ access_ports }}"
      register: access_state
      changed_when: false

    - name: Ensure access ports are set
      community.ciscosmb.command:
        commands:
          - configure terminal
          - "interface {{ item.item.port }}"
          - switchport mode access
          - "switchport access vlan {{ item.item.vlan }}"
          - exit
          - end
      loop: "{{ access_state.results }}"
      loop_control:
        label: "{{ item.item.port }}"
      when: "('switchport access vlan ' ~ item.item.vlan | string) not in item.stdout[0]"
      changed_when: true
      notify: Save running config

    - name: Read trunk port configs
      community.ciscosmb.command:
        commands: "show running-config interface {{ item.port }}"
      loop: "{{ trunk_ports }}"
      register: trunk_state
      changed_when: false

    - name: Ensure trunk ports are set
      community.ciscosmb.command:
        commands:
          - configure terminal
          - "interface {{ item.item.port }}"
          - switchport mode trunk
          - "switchport trunk native vlan {{ item.item.native }}"
          - exit
          - end
      loop: "{{ trunk_state.results }}"
      loop_control:
        label: "{{ item.item.port }}"
      when: "('switchport trunk native vlan ' ~ item.item.native | string) not in item.stdout[0]"
      changed_when: true
      notify: Save running config

  handlers:
    - name: Save running config
      community.ciscosmb.command:
        commands: copy running-config startup-config