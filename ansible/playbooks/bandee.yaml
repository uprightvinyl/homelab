---
- name: Configure bandee switch
  hosts: bandee
  gather_facts: false
  tasks:
    - name: Read current VLANs
      community.ciscosmb.command:
        commands: show vlan
      register: vlan_state
      changed_when: false                # a read never changes anything

    - name: Ensure required VLANs exist
      community.ciscosmb.command:
        commands:
          - configure terminal
          - vlan database
          - "vlan {{ item }}"
          - exit
          - end
      loop:
        - 20
        - 30
      when: vlan_state.stdout[0] is not search('(?m)^\s*' ~ item ~ '\s')
      changed_when: true                 # only reached when the VLAN was missing
      notify: Save running config

    - name: Read current L3 interfaces
      community.ciscosmb.command:
        commands: show ip interface
      register: ip_int_state
      changed_when: false

    - name: Ensure VLAN SVIs have their gateway IPs
      community.ciscosmb.command:
        commands:
          - configure terminal
          - "interface vlan {{ item.vlan }}"
          - "ip address {{ item.ip }} {{ item.mask }}"
          - exit
          - end
      loop:
        - { vlan: 20, ip: 10.0.20.1, mask: 255.255.255.0 }
        - { vlan: 30, ip: 10.0.30.1, mask: 255.255.255.0 }
      when: item.ip not in ip_int_state.stdout[0]
      changed_when: true
      notify: Save running config

  handlers:
    - name: Save running config
      community.ciscosmb.command:
        commands: copy running-config startup-config