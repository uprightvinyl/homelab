---
- name: Configure bandee switch
  hosts: bandee
  gather_facts: false
  tasks:
    - name: Read current VLANs
      community.ciscosmb.command:
        commands: show vlan
      register: vlan_state
      changed_when: false                # a read never changes anything

    - name: Ensure required VLANs exist
      community.ciscosmb.command:
        commands:
          - configure terminal
          - vlan database
          - "vlan {{ item }}"
          - exit
          - end
      loop:
        - 20
        - 30
      when: vlan_state.stdout[0] is not search('(?m)^\s*' ~ item ~ '\s')
      changed_when: true                 # only reached when the VLAN was missing
      notify: Save running config

  handlers:
    - name: Save running config
      community.ciscosmb.command:
        commands: copy running-config startup-config