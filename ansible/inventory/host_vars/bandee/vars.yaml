# Desired switch configuration for bandee
default_gateway: 10.0.10.2   # coo

vlans:
  - 20
  - 30

svis:
  - { vlan: 20, ip: 10.0.20.1, mask: 255.255.255.0 }
  - { vlan: 30, ip: 10.0.30.1, mask: 255.255.255.0 }

access_ports:
  - { port: gi2, vlan: 4 }    # rick
  - { port: gi9, vlan: 20 }   # meta
  - { port: gi25, vlan: 10 }  # coo (LAN / edge NAT uplink)

trunk_ports:
  - { port: gi3, native: 10 }   # nova01
  # gi4 reserved for dede when re-added (was kirby)