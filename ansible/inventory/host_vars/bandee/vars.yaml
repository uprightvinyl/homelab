# Desired switch configuration for bandee
vlans:
  - 20
  - 30

svis:
  - { vlan: 20, ip: 10.0.20.1, mask: 255.255.255.0 }
  - { vlan: 30, ip: 10.0.30.1, mask: 255.255.255.0 }

access_ports:
  - { port: gi2, vlan: 4 }    # rick
  - { port: gi9, vlan: 20 }   # meta
  - { port: gi25, vlan: 10 }    # rick

trunk_ports:
  - { port: gi3, native: 10 }   # dede
  - { port: gi4, native: 10 }   # kirby