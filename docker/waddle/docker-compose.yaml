services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
      - "67:67/udp"
      - "123:123/udp"
    cap_add:
      - SYS_TIME
    environment:
      TZ: Europe/London
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_dns_upstreams: '1.1.1.1;1.0.0.1'
      FTLCONF_dns_domain_name: 'lab.uprightlab.com'
      FTLCONF_misc_dnsmasq_lines: >-
        address=/coo.lab.uprightlab.com/10.0.10.2;
        address=/waddle.lab.uprightlab.com/10.0.10.10;
        address=/dede.lab.uprightlab.com/10.0.10.11;
        address=/nova01.lab.uprightlab.com/10.0.10.20;
        address=/nova.lab.uprightlab.com/10.0.10.30;
        address=/pc.lab.uprightlab.com/10.0.10.32;
        address=/meta.lab.uprightlab.com/10.0.20.10;
        address=/bandee.lab.uprightlab.com/192.168.4.254;
        address=/rick.lab.uprightlab.com/192.168.4.20
      FTLCONF_ntp_ipv4_active: 'true'
      FTLCONF_ntp_sync_active: 'true'
      FTLCONF_ntp_sync_server: 'uk.pool.ntp.org'
    volumes:
      - './etc-pihole:/etc/pihole'
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - pihole
  semaphore:
    container_name: semaphore
    build:
      context: .
      dockerfile: semaphore.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_DB: '/var/lib/semaphore/database.sqlite'
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_PASSWORD}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_USER}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_EMAIL}
      SEMAPHORE_ADMIN: ${SEMAPHORE_USER}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION}
    volumes:
      - semaphore_data:/var/lib/semaphore
    depends_on:
      - pihole
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2.0.23
    restart: unless-stopped
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    # Rebuild the hashed password file on every start, so it always matches the vault
    command:
      - sh
      - -c
      - >-
        rm -f /mosquitto/data/passwd &&
        mosquitto_passwd -b -c /mosquitto/data/passwd zigbee2mqtt "$$MQTT_PASSWORD" &&
        chown mosquitto:mosquitto /mosquitto/data/passwd &&
        chmod 0600 /mosquitto/data/passwd &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - './mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro'
      - mosquitto_data:/mosquitto/data
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.3
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/London
      Z2M_ONBOARD_NO_SERVER: '1'   # skip the first-run setup page
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: 'mqtt://mosquitto:1883'
      ZIGBEE2MQTT_CONFIG_MQTT_USER: zigbee2mqtt
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${MQTT_PASSWORD}
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/ttyUSB0
      ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ember
      ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE: '115200'
      ZIGBEE2MQTT_CONFIG_SERIAL_RTSCTS: 'false'
      ZIGBEE2MQTT_CONFIG_ADVANCED_CHANNEL: '25'   # changing this later can mean re-pairing
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: 'true'
      ZIGBEE2MQTT_CONFIG_FRONTEND_AUTH_TOKEN: ${ZIGBEE2MQTT_AUTH_TOKEN}
    devices:
      - '/dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Lite_MG21_727374ec57a2ef11a79f976661ce3355-if00-port0:/dev/ttyUSB0'
    volumes:
      - './zigbee2mqtt:/app/data'   # holds the network key, so back it up
      - '/run/udev:/run/udev:ro'
    depends_on:
      - mosquitto
volumes:
  semaphore_data:
  mosquitto_data: